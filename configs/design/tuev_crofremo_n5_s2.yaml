# Designed from the factor analysis over every TUEV run (2026-09-12): coupling-only tokenizer (0.688 avg over 12 runs)
# beats duplex (0.665) and waveform (0.551); frequency attention (0.666) beats no frequency axis (0.635);
# 16 bands (0.707) beats 8 (0.652); rotation (0.661) beats product (0.646). No previous run combined all four.
# arm n5: n_bands=16 d_model=128, +regularisation
name: tuev-crofremo_n5
group: design
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
seed: 2
max_hours: 6.0
