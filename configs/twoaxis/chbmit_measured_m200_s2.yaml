# Two-axis main-model candidate (2026-09-18). Derived from tuev_measured_s0.yaml;
# only dataset recipe fields differ (source: CFM4EEG-range-final-20260916/configs/range_final/chbmit_full_s0.yaml).
name: chbmit-range_twoaxis_measured_m200_20260917
group: range_twoaxis_20260917
dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 2
epochs: 20
batch_size: 32
eval_every_steps: 200
patience: 20
loss: focal
sample_rate: 200
model_kwargs:
  filter_range:
  - 0.5
  - 75.0
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 200
  waveform_modulation: quadrature
  space_over_bands: true
seed: 2
max_hours: 11.0
focal_alpha: 0.25
focal_gamma: 2.0
