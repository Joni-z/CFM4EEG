# two-axis main model, ISRUC seed 0. flatten_sequences and spatial_pe=index follow the
# tri-axial ISRUC config (quad16_seeds/isruc_s0.yaml): arrays are (night, 20, 6, 6000) and
# the 6-channel layout has no xyz montage. Everything else matches the two-axis template.
name: isruc-range_twoaxis_measured_m200_20260917
group: range_twoaxis_20260917
dataset: isruc
data_root: $PACLOCK_PROC/processed/isruc
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 5
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  filter_range:
  - 0.5
  - 75.0
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: index
  pac_patch_len: 200
  waveform_modulation: quadrature
  space_over_bands: true
seed: 0
max_hours: 0
flatten_sequences: true
