name: tuev-range_twoaxis_measured_m200_20260917
group: range_twoaxis_20260917
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
