# Two-axis main-model candidate (2026-09-18). Derived from tuev_measured_s0.yaml;
# only dataset recipe fields differ (source: CFM4EEG-a128-r1-20260916/configs/quad16_breadth/sleepedf_s0.yaml).
# Sleep-EDF is 100 Hz (Nyquist 50): filter_range [0.5, 49.0], as in the tri-axial
# sleepedf-quad_range_20260916 run (kappa 0.7004). The template value 75 is out of range.
name: sleepedf-range_twoaxis_measured_m200_20260917
group: range_twoaxis_20260917
dataset: sleepedf
data_root: $PACLOCK_PROC/processed/sleepedf
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 5
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 100
model_kwargs:
  filter_range:
  - 0.5
  - 49.0
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 200
  waveform_modulation: quadrature
  space_over_bands: true
seed: 0
max_hours: 0
