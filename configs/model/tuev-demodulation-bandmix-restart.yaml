name: tuev-demodulation-bandmix-restart-20261106
group: demodulation_content_controls
dataset: tuev
data_root: $LEGACY_VALIDATION_DATA/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  filter_range:
  - 0.5
  - 75.0
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: identity
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  waveform_modulation: quadrature
  band_mix_seed: 2
seed: 2
max_hours: 7.0
