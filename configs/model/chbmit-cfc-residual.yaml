name: chbmit-cfft_cfc_residual_twoaxis_20261030
group: cfc_residual_pilot_20261030
dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 2
epochs: 6
batch_size: 32
eval_every_steps: 1000
patience: 0
loss: focal
sample_rate: 200
model_kwargs:
  filter_range:
  - 0.5
  - 75.0
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: cfc
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  waveform_modulation: quadrature
  space_over_bands: true
  cfc_guidance: measured
  cfc_stabilized: false
  cfc_fusion: residual
seed: 0
max_hours: 0
focal_alpha: 0.75
focal_gamma: 2.0
save_checkpoint: true
run_monitor: true
require_rebuild_ready: true
amp: false
reproduction:
  kind: cfc_residual_tokenizer_pilot
  reference: configs/model/chbmit-cfc-h2.yaml
  changes:
  - frozen CFC operator; raw normalized coefficients without extra uncertainty shrinkage
  - separate harmonic value projections and learned dense context readout for all16
    content bands
  - add relation residual to intact envelope/waveform content; no forced rotation
  - 'CHB recipe: six complete cosine epochs, no early stopping, full validation every1000
    steps; positive focal alpha0.75'
  - recipe differs from prior pilot; not a structure-only controlled comparison
  seed: 0
  selection: validation only; no test-based tuning
  operator_source_tag: cfc-ready-source-20261029
checkpoint_selection: validation_best
preload: true
