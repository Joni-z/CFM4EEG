name: tuab-cfft_scratch_rebuild20261021
group: range_twoaxis_20260917
dataset: tuab
data_root: $PACLOCK_PROC/processed/tuab
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 2
epochs: 20
batch_size: 32
eval_every_steps: 200
patience: 20
loss: bce_with_logits
sample_rate: 200
model_kwargs:
  filter_range:
  - 0.5
  - 75.0
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  waveform_modulation: quadrature
  space_over_bands: true
seed: 0
max_hours: 0
save_checkpoint: true
run_monitor: true
require_rebuild_ready: true
amp: false
reproduction:
  kind: archived_reference_new_data
  runtime_source: ../history/repository-cleanup-20261022/configs/rebuild_reference/tuab_measured_s0.yaml
  reference: final two-axis runtime imported and strict checkpoint/initialization
    parity independently verified
  deviations:
  - Corrected accepted dataset version; previous dataset recipe unchanged.
  - No wall-clock truncation; recovery checkpoint required at cluster wall time.
