name: tuev-cfft_explicit_pac_identity_notch_20261028
group: explicit_pac_component_20261028
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: measured_pac
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  waveform_modulation: quadrature
  filter_range:
  - 0.5
  - 75.0
  space_over_bands: true
  measurement_mode: identity
  measurement_excluded_intervals:
  - - 56.0
    - 64.0
seed: 0
max_hours: 0
save_checkpoint: true
run_monitor: true
require_rebuild_ready: false
amp: false
checkpoint_selection: validation_best
reproduction:
  kind: paired_component_pilot
  comparison: same data, initialization, two-axis encoder and training recipe; only
    measurement_mode differs
  selection: validation_best
  analysis_anchors: fixed_initial_content_centers
  preprocessing_guard: 60 Hz Q=30 zero-phase notch; conservative 56-64 Hz exclusion
