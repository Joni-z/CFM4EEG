name: tuev-cfft_cfc_reference_20261030
group: cfc_reference_20261030
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 4
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: cfc
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  waveform_modulation: quadrature
  filter_range:
  - 0.5
  - 75.0
  space_over_bands: true
seed: 0
max_hours: 0
save_checkpoint: true
run_monitor: true
require_rebuild_ready: false
amp: false
checkpoint_selection: validation_best
reproduction:
  kind: operator_only_reference
  reference: configs/model/tuev-scratch.yaml
  changes:
  - new CFC operator replaces supported target rotation references; original local
    reference elsewhere
  - content, full rotation, encoder and training recipe unchanged
  - 'runtime: preload accepted arrays'
  seed: 0
  selection: validation_best
preload: true
