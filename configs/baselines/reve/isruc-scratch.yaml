name: isruc-reve_scratch_rebuild20261021
group: C
model: reve
dataset: isruc
num_classes: 5
sample_rate: 200
data_root: $PACLOCK_PROC/processed/isruc
pretrained: false
seed: 0
batch_size: 32
num_workers: 8
native_stages:
- n_epochs: 50
  patience: 2
  warmup_epochs: 5
  mixup: true
  dropout: 0.3
  optimizer:
    _target_: utils.stable_adamw.StableAdamW
    lr: 0.0001
    weight_decay: 0.01
    betas:
    - 0.92
    - 0.999
    eps: 1.0e-09
  name: ft
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: max
    factor: 0.5
    patience: 5
train_drop_last: false
save_checkpoint: true
run_monitor: true
runner: scripts/rebuild/run_reve_native.py
reproduction:
  kind: official_recipe_shared_cohort
  vendor: reve
  commit: 06a7059a07c3dabd80aee60c3dbc1eca4bdbe1c7
  source_recipe: isruc
  unused_upstream_fields:
  - task.clip
  - stage.dropout
  - task.classifier.dropout
  effective_clip: 2.0
  effective_dropout: 0.0
  deviations:
  - shared fixed patient cohort
  - test access deferred until final validation-selected checkpoint
  - Scratch uses full fine-tuning stage from random initialization, no meaningless
    frozen-random LP.
  - Native classifier dropout is controlled by top-level args.dropout (default0),
    not task.classifier.dropout0.1; preserve actual default0.
  - "Native ISRUC physical\xB5V/10 and scalp electrode positions retained on fixed\
    \ shared six-channel windows."
flatten_sequences: true
native_classifier:
  pooling: last
  dropout: 0.0
native_input_bridge: uv_div10
position_channels:
- F3
- C3
- O1
- F4
- C4
- O2
