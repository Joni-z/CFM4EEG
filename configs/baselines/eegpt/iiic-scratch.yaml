reproduction:
  kind: declared_new_IIIC_task_original_TUAB_trainer
  deviations:
  - No official EEGPT IIIC downstream recipe exists; this is a declared new-task adaptation
    of the released TUAB main/model/engine, not a claimed published IIIC reproduction.
  - Current accepted IIIC16x2000 cohort and physical uV/100 shared arrays, with splits73637/15778/15780
    and six labels0..5; no CHB READY or inverse-Q95 sidecar is applicable.
  - Original TUAB temporal decoder supports2000 samples; only learned input convolution23->20
    changes to16->20 and task head output changes1->6. No electrode relabeling or
    channel padding.
  - Randomly initialized full trainable encoder; no pretrained weights. Native multiclass
    LabelSmoothingCrossEntropy selected by nb_classes6; original AdamW5e-4,wd.05,50epochs,warmup5,layerdecay.65,batch100/rank,two
    ranks retained.
  - Explicit BF16 native-AMP runtime avoids known FP16 overflow; FP32 logits bridge
    supports original NumPy metrics. Arithmetic is recorded.
  - Restore physical microvolts in the input bridge; native engine divides100 exactly
    once. Smoke opens train/val only; formal testing follows validation-accuracy checkpoint
    selection; preserve predictions and checkpoints.
  required_world_size: 2
  effective_global_batch: 200
