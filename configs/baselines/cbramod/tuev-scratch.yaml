name: tuev-cbramod_scratch_native20261022
group: C
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: cbramod
loader: null
pretrained: false
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
epochs: 50
batch_size: 64
multi_lr: true
scheduler: cosine_updates
grad_clip: 1.0
patience: 0
num_workers: 0
device: cuda
eval_every_steps: 0
model_kwargs:
  dropout: 0.1
  classifier_hidden_dim: 1000
num_classes: 6
sample_rate: 200
loss: cross_entropy
label_smoothing: 0.1
seed: 0
model_output_classes: 6
max_hours: 0
scheduler_min_lr: 1.0e-06
train_drop_last: false
select_metric: cohen_kappa
run_monitor: true
save_checkpoint: true
amp: false
reproduction:
  kind: original_entrypoint_shared_cohort
  vendor: cbramod
  commit: b9e961003214326972c567eff390e75b0287e32a
  source:
  - models/model_for_tuev.py
  - finetune_main.py
  - finetune_trainer.py
  deviations:
  - Accepted shared arrays replace native pickle storage; shared preprocessing and
    patient cohort remain explicit.
  - User seed0 replaces the official CLI default3407.
  - Scoped parser bridge supplies scratch=False for use_pretrained_weights because
    upstream type=bool cannot parse False.
  data_gate: accepted manifest; CHB/TUAB must be corrected version
  execution: Pinned official finetune_main.main -> Trainer/Evaluator; no generic training
    loop.
  checkpoint_rule: Native strict validation-kappa maximum over50 epochs, restore best
    before test.
runner: scripts/rebuild/native_cbramod_entry.py
