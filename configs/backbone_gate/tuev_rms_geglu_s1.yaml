batch_size: 32
data_root: $PACLOCK_PROC/processed/tuev
dataset: tuev
device: cuda
epochs: 20
eval_every_steps: 0
grad_clip: 1.0
group: backbone_gate
label_smoothing: 0.1
loss: cross_entropy
lr: 0.0001
max_hours: 5
model: paclock
model_kwargs:
  arch: triaxial
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  band_pe: index
  block_variant: rms_geglu
  content_scale: 1.0
  content_source: band_broadband
  coupling_dim: 128
  d_model: 192
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 50
  pac_token_mode: measured
  patch_len: 50
  spatial_pe: xyz
  tokenizer_mode: factorized
name: tuev-factorized_f4_rmsgeglu
num_classes: 6
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
screening_note: Second-seed replication after the complete seed-0 validation gate
  passed. Keep model, data, augmentation, optimizer, 20 epochs and fixed training
  cap unchanged. TUEV uses the completed same-recipe seed-1 augmentation trial as
  historical legacy control, with execution-runtime caveat. No automatic pretraining
  or further expansion.
seed: 1
weight_decay: 1.0e-05
