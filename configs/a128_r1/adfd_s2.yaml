name: adfd-a128_r1_20260916
group: a128_r1
dataset: adfd
data_root: $PACLOCK_PROC/processed/adfd
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 3
epochs: 30
batch_size: 32
eval_every_steps: 200
patience: 20
loss: cross_entropy
focal_alpha: 0.25
focal_gamma: 2.0
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations:
  - jitter0.05
  - channel0.2
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: duplex
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
seed: 2
max_hours: 22.5
