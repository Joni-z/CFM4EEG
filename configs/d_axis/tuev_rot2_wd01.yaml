# D-axis regularisation arm (2026-09-14). All three seeds of tuev-paclock_rot2 select the
# epoch-0 checkpoint (verdict: peaked-first-eval, peak_index 0 of 20). Only weight_decay
# changes here: 1e-5 -> 0.01. LaBraM and CBraMod both fine-tune at 5e-2.
# Coupling-ONLY tokenizer (tokenizer_mode=pac_interaction, rotation): the grid carries the n_b interaction rows and
# no waveform row. Identical to _diag/tuev_paclock_duplex.yaml in every other respect (tri-axial, d128, same recipe).
# Reproduces the 09-03 `paclock_rot2` runs; configs were never checked in, recovered from the stored config.
name: tuev-rot2_wd01
group: C
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.01
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
seed: 0
max_hours: 4.5
