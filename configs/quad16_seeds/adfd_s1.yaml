name: adfd-quad16_breadth_20260915
group: quad16_breadth
dataset: adfd
data_root: $PACLOCK_PROC/processed/adfd
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 3
epochs: 30
batch_size: 32
eval_every_steps: 200
patience: 20
loss: cross_entropy
focal_alpha: 0.25
focal_gamma: 2.0
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  waveform_modulation: quadrature
seed: 1
max_hours: 3.0
